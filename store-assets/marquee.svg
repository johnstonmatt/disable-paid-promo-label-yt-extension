<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" role="img" aria-labelledby="title desc">
  <title id="title">Paid Promo Hider marquee tile</title>
  <desc id="desc">A wide promotional tile with a video player and crossed-out paid promotion tag.</desc>
  <rect width="1400" height="560" fill="#f8fafc"/>
  <g transform="translate(92 78)">
    <rect x="0" y="0" width="660" height="404" rx="24" fill="#111827"/>
    <rect x="34" y="34" width="592" height="284" rx="14" fill="#1f2937"/>
    <path d="M286 124 L388 184 L286 244 Z" fill="#f9fafb" opacity="0.92"/>
    <rect x="34" y="342" width="592" height="12" rx="6" fill="#374151"/>
    <rect x="34" y="342" width="298" height="12" rx="6" fill="#ef4444"/>
    <circle cx="332" cy="348" r="16" fill="#f9fafb"/>
    <g transform="translate(48 48)">
      <rect x="0" y="0" width="264" height="56" rx="28" fill="#f9fafb"/>
      <path d="M32 19 H74 L94 32 L74 45 H32 Z" fill="none" stroke="#111827" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="44" cy="32" r="4" fill="#111827"/>
