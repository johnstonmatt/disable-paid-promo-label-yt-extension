    <text x="0" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="58" font-weight="850" fill="#111827">for YouTube™</text>
    <text x="2" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="25" fill="#475569">Hide the clickable paid promotion overlay</text>
    <text x="2" y="156" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="25" fill="#475569">button while you watch videos.</text>
    <rect x="2" y="210" width="184" height="48" rx="24" fill="#111827"/>
    <text x="94" y="241" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="800" fill="#ffffff">No tracking</text>
    <rect x="204" y="210" width="224" height="48" rx="24" fill="#e5e7eb"/>
    <text x="316" y="241" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="800" fill="#111827">Local-only</text>
