name: Validate Extension

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate manifest and assets
        run: node scripts/validate-extension.mjs

      - name: Run smoke tests
        run: node scripts/smoke-test-content.mjs

      - name: Build upload ZIP
        run: bash scripts/package-extension.sh

      - name: Inspect upload ZIP
        run: unzip -l dist/*.zip
