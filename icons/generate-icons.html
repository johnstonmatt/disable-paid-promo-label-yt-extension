<!DOCTYPE html>
<html>
  <head>
    <title>Generate Extension Icons</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 20px;
        background: #f5f5f5;
      }
      canvas {
        border: 1px solid #ccc;
        margin: 10px;
        background: white;
      }
      .icon-row {
        margin: 20px 0;
      }
      a {
        display: inline-block;
        margin: 5px;
        padding: 8px 16px;
        background: #4285f4;
        color: white;
        text-decoration: none;
        border-radius: 4px;
      }
      a:hover {
        background: #3367d6;
      }
    </style>
  </head>
  <body>
    <h1>Extension Icon Generator</h1>
    <p>Click the download links to save each icon size.</p>

    <div class="icon-row">
      <h3>16x16</h3>
      <canvas id="icon16" width="16" height="16"></canvas>
      <a id="download16" download="icon16.png">Download 16x16</a>
    </div>

    <div class="icon-row">
      <h3>48x48</h3>
      <canvas id="icon48" width="48" height="48"></canvas>
      <a id="download48" download="icon48.png">Download 48x48</a>
    </div>

    <div class="icon-row">
      <h3>128x128</h3>
      <canvas id="icon128" width="128" height="128"></canvas>
      <a id="download128" download="icon128.png">Download 128x128</a>
    </div>

    <script>
      const svgSource =
        `<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
      <rect x="8" y="8" width="112" height="112" rx="26" fill="#111827"/>
      <path d="M36 50 H72 L92 64 L72 78 H36 Z" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="46" cy="64" r="5" fill="#FFFFFF"/>
      <path d="M38 90 L90 38" stroke="#EF4444" stroke-width="12" stroke-linecap="round"/>
    </svg>`;

      const sizes = [16, 48, 128];

      sizes.forEach((size) => {
        const canvas = document.getElementById("icon" + size);
        const ctx = canvas.getContext("2d");
        const img = new Image();

        img.onload = function () {
          ctx.drawImage(img, 0, 0, size, size);
          document.getElementById("download" + size).href = canvas
            .toDataURL("image/png");
        };

        const blob = new Blob([svgSource], { type: "image/svg+xml" });
        img.src = URL.createObjectURL(blob);
      });
    </script>
  </body>
</html>
